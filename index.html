    padding: 0 18px;
    cursor: pointer;
  }

  button:hover {
    background: #9a6f4e;
  }

  .type {

    gap: 8px;

  }

  .msg li {

  .msg a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  
  .status {
    display: flex;
    align-items: center;
    gap: 6px;

    margin-top: 4px;

    font-size: 12px;

  #closeChat {
    background: transparent;
    color: white;
    border: none;

  #launcher {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 60px;
    height: 60px;
    background: #e2ac2d;
    color: white;
    border-radius: 50%;

    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);

    }

  <!-- making it toggleable  -->

<div id="launcher">
  💭

</div>

    <button onclick="send()">Send</button>

<script>
// We keep track of history in a simple string to send to the backend
let chatHistory = "";

async function send() {
  const input = document.getElementById("msg");
  const msg = input.value.trim();
  if (!msg) return;

  // 1. Render user message in UI
  addMessage("You", msg, "user");
  input.value = "";

  // 2. Visual indicator that the bot is thinking
  const typingDiv = addTypingIndicator();

  try {
    // 3. Make the fetch call matching FastAPI's ChatRequest model
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        question: msg,       // Changed from 'message' to 'question'
        history: chatHistory 
      })
    });

    if (!res.ok) {
      throw new Error("Network response was not ok");
    }

    const data = await res.json();
    
    // Remove the typing indicator
    typingDiv.remove();

    // 4. Render the actual answer (matching FastAPI's 'answer' key)
    //addMessage("Bot", data.answer, "bot"); 
    await addBotMessages(data.answer);

    // 5. Update local history context for the next turn
    chatHistory += `user: ${msg}\nassistant: ${data.answer}\n`;

  } catch (error) {
    console.error("Error calling API:", error);
    typingDiv.innerText = "Sorry, something went wrong. Please try again.";
  }
}

function addTypingIndicator() {
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.innerHTML = '<span></span><span></span><span></span>';
  const chatWindow = document.getElementById("chat");
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

function formatMessage(text) {

  // Convert markdown links [text](url) into clickable links
  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank">$1</a>'
  );

  const lines = text.split("\n");

  let html = "";
  let inUL = false;
  let inOL = false;
  let orderedListStart = 1;

  for (let line of lines) {

    line = line.trim();

    // Bullet points: -, *, or •
    if (/^[-*•]\s+/.test(line)) {

      if (inOL) {
        html += "</ol>";
        inOL = false;
      }

      if (!inUL) {
        html += "<ul>";
        inUL = true;
      }

      const item = line.replace(/^[-*•]\s+/, "");
      html += `<li>${item}</li>`;

      continue;
    }

    // Numbered lists: 1. or 1)
    if (/^\d+[\.\)]\s+/.test(line)) {

      if (inUL) {
        html += "</ul>";
        inUL = false;
      }

      if (!inOL) {
        orderedListStart = Number(line.match(/^(\d+)[\.\)]\s+/)[1]);
        html += `<ol start="${orderedListStart}">`;
        inOL = true;
      }

      const item = line.replace(/^\d+[\.\)]\s+/, "");
      html += `<li>${item}</li>`;

      continue;
    }

    // Close any open list
    if (inUL) {
      html += "</ul>";
      inUL = false;
    }

    if (inOL) {
      html += "</ol>";
      inOL = false;
    }

    // Normal text
    if (line) {
      html += `<div>${line}</div>`;
    }
  }

  // Close lists if message ended with one
  if (inUL) {
    html += "</ul>";
  }

  if (inOL) {
    html += "</ol>";
  }

  return html;
}



//new function for messages with timestamps

function addMessage(sender, text, type) {

  const wrapper = document.createElement("div");
  wrapper.className = "message-wrapper " + type;

  const div = document.createElement("div");
  div.className = "msg " + type;

  text = formatMessage(text);

  div.innerHTML = text;

  const timestamp = document.createElement("div");
  timestamp.className = "timestamp";

  const now = new Date();

  timestamp.innerText = now.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });

  wrapper.appendChild(div);
  wrapper.appendChild(timestamp);

  const chatWindow = document.getElementById("chat");

  chatWindow.appendChild(wrapper);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  return wrapper;
}



//making it async to handle multiple messages from the bot

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function addBotMessages(text) {

    //Split the text into parts based on numbered steps or paragraphs
    const lines = text.split("\n").map(line => line.trim()).filter(Boolean);
    const hasNumberedSteps = lines.some(line => /^\d+[\.\)]\s+/.test(line));

    let parts = hasNumberedSteps
        ? lines
        : text
            .split(/\n\s*\n/)
            .map(p => p.trim())
            .filter(p => p.length > 0);

    // If Gemini didn't use blank lines,
    // split long paragraphs into sentences.
    if (parts.length === 1) {

        parts = text.match(/[^.!?]+[.!?]+/g) || [text];

        // Group every two sentences together
        const grouped = [];

        for (let i = 0; i < parts.length; i += 2) {
            grouped.push(parts.slice(i, i + 2).join(" "));
        }

        parts = grouped;
    }

    for (const part of parts) {
        addMessage("Bot", part, "bot");
        await sleep(150);
    }
}


// greeting message

  window.addEventListener("load", () => {

const launcher = document.getElementById("launcher");
const chatWindow = document.querySelector(".container");

closeChat.onclick = () => {

    chatWindow.style.display = "none";

// Allow pressing "Enter" key to send messages
document.getElementById("msg").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    send();
  }
