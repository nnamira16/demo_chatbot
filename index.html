<!DOCTYPE html>
<html>
<head>
  <title>Taelor Chat</title>

  <style>
    body {
      font-family: Arial;
      background: #f6f3ef;
      /* display: flex;
      justify-content: center;
      padding: 40px; */
      margin:auto;
    }

    .container {
      /* width: 420px; */
      position: fixed;
      bottom: 90px;
      right: 25px;
      width: 400px;
      height: 600px;

      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      display: none;
    }

    .header {
      background: #b08968;
      color: white;
      padding: 16px;
      font-weight: bold;
    }

    #chat {
      height: 450px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #b08968;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #f1ece7;
      color: #222;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      background: #b08968;
      color: white;
      border: none;
      padding: 0 18px;
      cursor: pointer;
    }

    button:hover {
      background: #9a6f4e;
    }

    .type { 
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 10px 12px;
    }

    .typing span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #b08968;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: 0;
      }
      40% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    Taelor Help Chat
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input id="msg" placeholder="Ask our chatbot" />
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
// We keep track of history in a simple string to send to the backend
let chatHistory = "";

async function send() {
  const input = document.getElementById("msg");
  const msg = input.value.trim();
  if (!msg) return;

  // 1. Render user message in UI
  addMessage("You", msg, "user");
  input.value = "";

  // 2. Visual indicator that the bot is thinking
  const typingDiv = addTypingIndicator();

  try {
    // 3. Make the fetch call matching FastAPI's ChatRequest model
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        question: msg,       // Changed from 'message' to 'question'
        history: chatHistory 
      })
    });

    if (!res.ok) {
      throw new Error("Network response was not ok");
    }

    const data = await res.json();
    
    // Remove the typing indicator
    typingDiv.remove();

    // 4. Render the actual answer (matching FastAPI's 'answer' key)
    //addMessage("Bot", data.answer, "bot"); 
    await addBotMessages(data.answer);

    // 5. Update local history context for the next turn
    chatHistory += `user: ${msg}\nassistant: ${data.answer}\n`;

  } catch (error) {
    console.error("Error calling API:", error);
    typingDiv.innerText = "Sorry, something went wrong. Please try again.";
  }
}

function addTypingIndicator() {
  const div = document.createElement("div");
  div.className = "msg bot typing";
  div.innerHTML = '<span></span><span></span><span></span>';
  const chatWindow = document.getElementById("chat");
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

function addMessage(sender, text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;

  // Convert markdown links [text](url) into clickable HTML
  text = text.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank">$1</a>'
  );

  // Convert plain URLs into clickable links
  text = text.replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank">$1</a>'
  );

  div.innerHTML = text;

  const chatWindow = document.getElementById("chat");
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;

  return div;
}

//making it async to handle multiple messages from the bot

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function addBotMessages(text) {

    // Split on blank lines first
    let parts = text
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(p => p.length > 0);

    // If Gemini didn't use blank lines,
    // split long paragraphs into sentences.
    if (parts.length === 1) {

        parts = text.match(/[^.!?]+[.!?]+/g) || [text];

        // Group every two sentences together
        const grouped = [];

        for (let i = 0; i < parts.length; i += 2) {
            grouped.push(parts.slice(i, i + 2).join(" "));
        }

        parts = grouped;
    }

    for (const part of parts) {
        addMessage("Bot", part, "bot");
        await sleep(500);
    }
}


// greeting message

  window.addEventListener("load", () => {
    addMessage("Bot", "Hello! How can I help you today?", "bot");
  });



// Allow pressing "Enter" key to send messages
document.getElementById("msg").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
